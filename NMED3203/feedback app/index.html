<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback Loop: Gravity Tank</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <header>
            <h1>GRAVITY TANK</h1>
            <p><strong>Goal:</strong> Stop the draining liquid exactly at the <strong>50 target line</strong>.</p>
        </header>

        <fieldset class="mode-selector">
            <legend>System Vision</legend>
            <label><input type="radio" name="mode" value="full" checked> Full Visibility</label>
            <label><input type="radio" name="mode" value="ack"> Blind Mode</label>
        </fieldset>

        <!-- Oyun Alanı -->
        <div id="game-board">
            <div id="tank-container">
                <!-- Hedef Çizgisi -->
                <div id="target-line"><span>50</span></div>
                <!-- İndigo Sıvı -->
                <div id="indigo-liquid"></div>
                <!-- Kör Mod Kepengi -->
                <div id="blind-shutter" hidden>
                    <div class="shutter-text">
                        <span>BLIND MODE</span>
                        <small>Trust your timing</small>
                    </div>
                </div>
            </div>
            
            <div id="status-panel" aria-live="polite">
                <div class="status-box">
                    <span class="label">LEVEL</span>
                    <span id="level-text" class="value">80</span>
                </div>
                <div class="status-box">
                    <span class="label">STATUS</span>
                    <span id="status-text" class="value">Paused</span>
                </div>
            </div>
        </div>

        <!-- Oyun Kontrolleri -->
        <div class="controls">
            <button id="btn-add" class="action-btn">PUMP (+10)</button>
            <button id="btn-start">Start Drain</button>
            <button id="btn-pause">Pause / Stop</button>
            <button id="btn-reset">Reset</button>
            <button id="btn-reveal" hidden>Reveal Result</button>
        </div>
        
        <!-- Sadece Kör Modda Anlamlı Olan Geri Bildirim Sinyali -->
        <div id="action-ack-container">
            <span id="action-ack" aria-live="assertive"></span>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temporality: The Echo Loop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <header>
            <h1>TEMPORAL PARADOX</h1>
            <p><strong>Goal:</strong> Both switches must be [ON] at the exact same time to open the door.</p>
        </header>

        <div id="status-panel" aria-live="polite">
            <div class="panel-item">
                <span>Phase:</span>
                <strong id="phase-text" class="status-value">IDLE</strong>
            </div>
            <div class="panel-item">
                <span>Loop Time:</span>
                <strong id="time-text" class="status-value">0.0s</strong>
            </div>
            <div class="panel-item">
                <span>Door:</span>
                <strong id="door-text" class="status-value locked">LOCKED</strong>
            </div>
        </div>

        <div id="game-container">
            <canvas id="game-canvas" width="400" height="300">
                Your browser does not support HTML5 Canvas.
            </canvas>
        </div>

        <div class="controls">
            <div class="d-pad" aria-hidden="true">
                <div></div>
                <button id="btn-up" class="dir-btn">W</button>
                <div></div>
                <button id="btn-left" class="dir-btn">A</button>
                <button id="btn-down" class="dir-btn">S</button>
                <button id="btn-right" class="dir-btn">D</button>
            </div>
            <div class="action-buttons">
                <button id="btn-action" class="primary-btn">RECORD / LOOP (Space)</button>
                <button id="btn-reset">RESET TIMELINE</button>
            </div>
        </div>
        
        <p id="instruction-text">Press 'Record' and walk to the first switch. Stand on it, then press 'Loop'.</p>
    </main>
    <script src="script.js"></script>
</body>
</html>
